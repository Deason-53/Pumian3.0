    <!-- 自定义样式 -->
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fbfbf9; color: #2c2c2a; }
        .font-serif { font-family: 'Noto Serif SC', serif; }
        
        /* 轮播图动画 */
        .fade-slide { transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out; }
        .slide-hidden { opacity: 0; pointer-events: none; z-index: 0; transform: scale(1.05); }
        .slide-active { opacity: 1; pointer-events: auto; z-index: 10; transform: scale(1); }
        
        /* 文本上升浮现动画 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.8s forwards; }
        
        /* 平滑滚动 */
        html { scroll-behavior: smooth; }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #fbfbf9; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
    </style>

    <!-- ========================================================================================= -->
    <!--                核心逻辑控制脚本 (无需修改，自动读取顶部的配置区)                            -->
    <!-- ========================================================================================= -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 当前语言状态管理 (默认中文，优先读取本地存储)
            let currentLang = localStorage.getItem('pumian_lang') || 'zh';
            let carouselInterval = null;

            function renderPage(lang) {
                const config = window.PUMIAN_CONFIG[lang];

                // 1. 初始化 SEO 和网页标题
                document.title = config.pageTitle;
                document.querySelector('meta[name="description"]').setAttribute("content", config.metaDescription);

                // 2. 将配置文本绑定到对应的 HTML 元素
                const dataElements = document.querySelectorAll('[data-config]');
                dataElements.forEach(el => {
                    const key = el.getAttribute('data-config');
                    if (config[key]) {
                        el.textContent = config[key];
                    }
                });

                // 3. 渲染轮播图
                const carouselContainer = document.getElementById('hero-carousel');
                if (config.carousel && config.carousel.length > 0) {
                    let slidesHtml = '';
                    config.carousel.forEach((slide, index) => {
                        const isActive = index === 0 ? 'slide-active' : 'slide-hidden';
                        slidesHtml += `
                            <div class="absolute inset-0 w-full h-full fade-slide ${isActive}" data-slide-index="${index}">
                                <!-- 背景图片叠加黑色半透明遮罩以凸显文字 -->
                                <div class="absolute inset-0 bg-black/30 z-10"></div>
                                <img src="${slide.image}" class="absolute inset-0 w-full h-full object-cover z-0" alt="${slide.title}">
                                
                                <!-- 文字内容 -->
                                <div class="absolute inset-0 z-20 flex flex-col items-center justify-center text-center px-4">
                                    <h1 class="text-white text-4xl md:text-6xl font-serif mb-6 tracking-[0.15em] opacity-0 animate-fade-in-up" style="animation-delay: 0.2s;">
                                        ${slide.title}
                                    </h1>
                                    <p class="text-[#fbfbf9] text-lg md:text-xl font-light tracking-widest opacity-0 animate-fade-in-up" style="animation-delay: 0.5s;">
                                        ${slide.subtitle}
                                    </p>
                                </div>
                            </div>
                        `;
                    });
                    carouselContainer.innerHTML = slidesHtml;

                    // 重置并启动轮播逻辑
                    if (carouselInterval) clearInterval(carouselInterval);
                    let currentSlide = 0;
                    const slides = document.querySelectorAll('.fade-slide');
                    if(slides.length > 1) {
                        carouselInterval = setInterval(() => {
                            slides[currentSlide].classList.remove('slide-active');
                            slides[currentSlide].classList.add('slide-hidden');
                            
                            currentSlide = (currentSlide + 1) % slides.length;
                            
                            // 重置动画
                            const nextSlide = slides[currentSlide];
                            const texts = nextSlide.querySelectorAll('.animate-fade-in-up');
                            texts.forEach(text => {
                                text.style.animation = 'none';
                                text.offsetHeight; // trigger reflow
                                text.style.animation = null;
                            });
                            
                            nextSlide.classList.remove('slide-hidden');
                            nextSlide.classList.add('slide-active');
                        }, 5000); // 5秒切换一次
                    }
                }

                // 4. 渲染产品区
                const productGrid = document.getElementById('product-grid');
                if (config.products && config.products.length > 0) {
                    let productsHtml = '';
                    config.products.forEach(product => {
                        const tagHtml = product.tag ? `<div class="absolute top-0 left-0 bg-[#2c2c2a] text-white text-[10px] px-3 py-1 tracking-wider z-10">${product.tag}</div>` : '';
                        productsHtml += `
                            <div class="group cursor-pointer">
                                <div class="relative w-full aspect-[4/5] bg-stone-100 overflow-hidden mb-6">
                                    ${tagHtml}
                                    <img src="${product.image}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" alt="${product.name}">
                                </div>
                                <div class="text-center">
                                    <h3 class="text-stone-800 text-sm font-medium tracking-wide mb-2 group-hover:text-stone-500 transition-colors">${product.name}</h3>
                                    <p class="text-stone-500 text-sm font-serif">${product.price}</p>
                                </div>
                            </div>
                        `;
                    });
                    productGrid.innerHTML = productsHtml;
                }
            }

            // 初始化首次渲染
            renderPage(currentLang);

            // 绑定切换语言事件
            const switchLang = () => {
                currentLang = currentLang === 'zh' ? 'en' : 'zh';
                localStorage.setItem('pumian_lang', currentLang);
                renderPage(currentLang);
            };

            document.getElementById('lang-switch-btn').addEventListener('click', switchLang);
            document.getElementById('mobile-lang-switch-btn').addEventListener('click', switchLang);

            // 5. 导航栏滚动交互特效
            const header = document.getElementById('main-header');
            window.addEventListener('scroll', () => {
                // 如果向下滚动超过 50px，改变导航栏颜色
                if (window.scrollY > 50) {
                    header.classList.remove('bg-transparent', 'text-white', 'border-transparent', 'py-4');
                    header.classList.add('bg-white/95', 'backdrop-blur-md', 'text-stone-800', 'border-stone-200', 'shadow-sm');
                    // 确保滚下去后SVG图标颜色一致
                    header.querySelectorAll('nav a').forEach(a => a.classList.add('hover:text-stone-500'));
                } else {
                    header.classList.add('bg-transparent', 'text-white', 'border-transparent', 'py-4');
                    header.classList.remove('bg-white/95', 'backdrop-blur-md', 'text-stone-800', 'border-stone-200', 'shadow-sm');
                }
            });
        });
    </script>
